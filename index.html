<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Cá Nhân Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Tông màu xanh Teal/Dark Cyan hiện đại, chuyên nghiệp */
            --primary-color: #008080; 
            --secondary-color: #e0f2f1;
            --text-color: #333;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --danger-color: #ff6b6b;
            --star-color: #f1c40f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr; /* Chia 2 cột */
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 4px solid var(--primary-color);
        }

        /* Khi màn hình nhỏ thì dồn thành 1 cột */
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- PHẦN HOẠT ĐỘNG --- */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .rating-select {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        
        button.btn-gym { background-color: #2c3e50; } /* Màu riêng cho Gym */

        /* --- PHẦN GHI CHÚ --- */
        textarea {
            width: 100%;
            height: 150px; /* Làm cho vùng nhập lớn hơn hẳn */
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            resize: vertical;
            font-family: inherit;
            box-sizing: border-box; /* Đảm bảo padding không làm vỡ layout */
        }

        /* --- PHẦN TO-DO LIST --- */
        .todo-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .todo-input-group input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        ul.todo-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li.todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        li.todo-item.completed span {
            text-decoration: line-through;
            color: #888;
        }

        .delete-btn {
            background: none;
            color: var(--danger-color);
            padding: 5px;
        }

        /* --- PHẦN LỊCH SỬ --- */
        .history-list {
            list-style: none;
            padding: 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .history-item {
            background: var(--secondary-color);
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            border-left: 3px solid var(--primary-color);
        }

        .stars-display {
            color: var(--star-color);
            margin-left: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="column">
        <div class="card">
            <h2><i class="fa-solid fa-chart-line"></i> Đánh Giá Hoạt Động</h2>
            
            <div class="controls">
                <div class="rating-select">
                    <label>Chất lượng:</label>
                    <select id="starRating">
                        <option value="5">5 Sao (Tuyệt vời)</option>
                        <option value="4">4 Sao (Tốt)</option>
                        <option value="3">3 Sao (Bình thường)</option>
                        <option value="2">2 Sao (Tệ)</option>
                        <option value="1">1 Sao (Rất tệ)</option>
                    </select>
                </div>

                <div class="btn-group">
                    <button id="btnStudy" onclick="addLog('Học tập')">
                        <i class="fa-solid fa-book"></i> Học tập
                    </button>
                    <button id="btnGym" class="btn-gym" onclick="addLog('Gym')">
                        <i class="fa-solid fa-dumbbell"></i> Gym
                    </button>
                </div>
            </div>
        </div>

        <br>

        <div class="card">
            <h2><i class="fa-solid fa-pen-to-square"></i> Ghi Chú Nhanh</h2>
            <textarea id="quickNote" placeholder="Ghi lại ý tưởng hoặc lưu ý quan trọng tại đây..."></textarea>
            <button onclick="saveNote()" style="margin-top: 10px; width: 100%; justify-content: center;">
                <i class="fa-solid fa-floppy-disk"></i> Lưu Ghi Chú
            </button>
        </div>
    </div>

    <div class="column">
        <div class="card">
            <h2><i class="fa-solid fa-list-check"></i> Nhiệm Vụ Hôm Nay</h2>
            <div class="todo-input-group">
                <input type="text" id="todoInput" placeholder="Thêm việc cần làm...">
                <button onclick="addTodo()"><i class="fa-solid fa-plus"></i></button>
            </div>
            <ul id="todoList" class="todo-list">
                </ul>
        </div>

        <br>

        <div class="card">
            <h2><i class="fa-solid fa-clock-rotate-left"></i> Lịch Sử Hoạt Động</h2>
            <ul id="historyList" class="history-list">
                </ul>
        </div>
    </div>
</div>

<script>
    // --- 1. XỬ LÝ LỊCH SỬ HOẠT ĐỘNG ---
    function addLog(activityName) {
        const rating = document.getElementById('starRating').value;
        const now = new Date();
        const timeString = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
        const dateString = now.toLocaleDateString('vi-VN');

        // Tạo chuỗi sao (ví dụ: 4 sao -> ★★★★☆)
        let starsHtml = '';
        for(let i=1; i<=5; i++) {
            if(i <= rating) starsHtml += '<i class="fa-solid fa-star"></i>';
            else starsHtml += '<i class="fa-regular fa-star"></i>'; // Sao rỗng
        }

        const logItem = {
            activity: activityName,
            time: `${dateString} - ${timeString}`,
            stars: starsHtml, // Lưu luôn HTML của sao để hiển thị cho lẹ
            ratingVal: rating
        };

        // Lưu vào LocalStorage
        let history = JSON.parse(localStorage.getItem('userHistory')) || [];
        history.unshift(logItem); // Thêm vào đầu danh sách
        localStorage.setItem('userHistory', JSON.stringify(history));

        renderHistory();
    }

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem('userHistory')) || [];
        const historyList = document.getElementById('historyList');
        historyList.innerHTML = '';

        history.forEach(item => {
            const li = document.createElement('li');
            li.className = 'history-item';
            li.innerHTML = `
                <div><strong>${item.activity}</strong> <span class="stars-display">${item.stars}</span></div>
                <div style="font-size: 0.8em; color: #666; margin-top: 4px;">
                    <i class="fa-regular fa-clock"></i> ${item.time}
                </div>
            `;
            historyList.appendChild(li);
        });
    }

    // --- 2. XỬ LÝ GHI CHÚ (NOTES) ---
    function saveNote() {
        const noteContent = document.getElementById('quickNote').value;
        localStorage.setItem('userNote', noteContent);
        alert('Đã lưu ghi chú thành công!');
    }

    // --- 3. XỬ LÝ TO-DO LIST (NHIỆM VỤ) ---
    function addTodo() {
        const input = document.getElementById('todoInput');
        const text = input.value.trim();
        if (!text) return;

        const todos = JSON.parse(localStorage.getItem('dailyTodos')) || [];
        todos.push({ text: text, completed: false });
        localStorage.setItem('dailyTodos', JSON.stringify(todos));
        
        input.value = '';
        renderTodos();
    }

    function toggleTodo(index) {
        const todos = JSON.parse(localStorage.getItem('dailyTodos')) || [];
        todos[index].completed = !todos[index].completed;
        localStorage.setItem('dailyTodos', JSON.stringify(todos));
        renderTodos();
    }

    function deleteTodo(index) {
        const todos = JSON.parse(localStorage.getItem('dailyTodos')) || [];
        todos.splice(index, 1);
        localStorage.setItem('dailyTodos', JSON.stringify(todos));
        renderTodos();
    }

    function renderTodos() {
        const todos = JSON.parse(localStorage.getItem('dailyTodos')) || [];
        const list = document.getElementById('todoList');
        list.innerHTML = '';

        todos.forEach((todo, index) => {
            const li = document.createElement('li');
            li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
            li.innerHTML = `
                <div style="display:flex; align-items:center; gap: 10px;">
                    <input type="checkbox" onchange="toggleTodo(${index})" ${todo.completed ? 'checked' : ''}>
                    <span>${todo.text}</span>
                </div>
                <button class="delete-btn" onclick="deleteTodo(${index})">
                    <i class="fa-solid fa-trash"></i>
                </button>
            `;
            list.appendChild(li);
        });
    }

    // --- 4. KHỞI TẠO KHI LOAD TRANG ---
    window.onload = function() {
        // Load lịch sử
        renderHistory();
        
        // Load ghi chú cũ
        const savedNote = localStorage.getItem('userNote');
        if (savedNote) document.getElementById('quickNote').value = savedNote;

        // Load To-do list
        renderTodos();
    }
</script>

</body>
</html>
