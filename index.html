<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Life OS | Self-Mastery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #22d3ee;
            --secondary: #a855f7;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --success: #34d399;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 10% 20%, rgba(34, 211, 238, 0.1) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h2 { margin: 0; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(to right, var(--accent), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .level-info { text-align: right; }
        .level-badge {
            background: linear-gradient(135deg, var(--accent), var(--secondary));
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 800;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.5);
        }

        .xp-container {
            width: 120px;
            background: rgba(255,255,255,0.1);
            height: 8px;
            border-radius: 10px;
            margin-top: 8px;
            overflow: hidden;
        }
        .xp-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--secondary));
            width: 0%;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 8px var(--accent);
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.9em;
        }

        .tab-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
        .tab-btn.active {
            background: var(--text-main);
            color: var(--bg-dark);
            border-color: var(--text-main);
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        .section { display: none; width: 100%; max-width: 600px; animation: slideUp 0.4s ease-out; }
        .section.active { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--glass-bg);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            margin-bottom: 20px;
            backdrop-filter: blur(12px);
        }

        .card h3 { margin-top: 0; font-size: 1.2em; display: flex; align-items: center; gap: 10px; }
        .card h3 i { color: var(--accent); }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0 15px 0;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-radius: 10px;
            box-sizing: border-box;
            font-family: inherit;
            transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.2);
        }

        button.action-btn {
            background: linear-gradient(135deg, var(--accent), #3b82f6);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        button.action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(34, 211, 238, 0.4);
        }
        button.action-btn:active { transform: translateY(0); }

        .log-item {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            margin-top: 10px;
            border-left: 4px solid var(--secondary);
            border-radius: 8px;
            font-size: 0.95em;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .log-date { font-size: 0.75em; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}

        .xp-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, var(--success), #10b981);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(52, 211, 153, 0.4);
            animation: popIn 0.5s ease-out;
            z-index: 1000;
        }

        @keyframes popIn {
            0% { transform: translateY(-100px) scale(0.8); opacity: 0; }
            50% { transform: translateY(10px) scale(1.05); }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .stat-card {
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent);
        }

        .stat-card h4 {
            margin: 0 0 10px 0;
            color: var(--accent);
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 800;
            background: linear-gradient(to right, var(--accent), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2><i class="fa-solid fa-layer-group"></i> Life OS</h2>
            <div style="font-size: 0.85em; color: var(--text-muted); margin-top: 5px;">Build your dream life, one day at a time.</div>
        </div>
        <div class="level-info">
            <span class="level-badge" id="userLevel">LVL 1</span>
            <div style="margin-top:8px; font-size: 0.75em; color: var(--text-muted);">XP: <span id="currentXP">0</span> / <span id="nextLevelXP">1000</span></div>
            <div class="xp-container">
                <div class="xp-bar" id="xpBar"></div>
            </div>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('learning')"><i class="fa-solid fa-code"></i> Học Tập</button>
        <button class="tab-btn" onclick="switchTab('gym')"><i class="fa-solid fa-dumbbell"></i> Gym</button>
        <button class="tab-btn" onclick="switchTab('mind')"><i class="fa-solid fa-brain"></i> Tâm Trí</button>
        <button class="tab-btn" onclick="switchTab('stats')"><i class="fa-solid fa-chart-pie"></i> Thống Kê</button>
    </div>

    <div id="learning" class="section active">
        <div class="card">
            <h3><i class="fa-solid fa-graduation-cap"></i> Nhật ký học tập</h3>
            <input type="text" id="learnSubject" placeholder="Hôm nay học gì? (VD: C++ Pointer)">
            
            <div style="display: flex; gap: 10px;">
                <input type="number" id="learnDuration" placeholder="Phút" style="flex:1">
                <select id="learnRating" style="flex:1">
                    <option value="5">🔥 Siêu tập trung</option>
                    <option value="4">✨ Tốt</option>
                    <option value="3">😐 Bình thường</option>
                    <option value="2">🥱 Hơi lười</option>
                </select>
            </div>

            <textarea id="learnTakeaway" rows="2" placeholder="Bài học rút ra là..."></textarea>
            
            <button class="action-btn" onclick="addLog('learning')"><i class="fa-solid fa-plus"></i> Lưu & Nhận +50 XP</button>
        </div>
        <div id="learningLogs"></div>
    </div>

    <div id="gym" class="section">
        <div class="card">
            <h3><i class="fa-solid fa-heart-pulse"></i> Gym & Sức khỏe</h3>
            <input type="text" id="gymExercise" placeholder="Bài tập (VD: Squat)">
            <div style="display: flex; gap: 10px;">
                <input type="number" id="gymKg" placeholder="Kg">
                <input type="number" id="gymReps" placeholder="Reps">
            </div>
            <button class="action-btn" onclick="addLog('gym')"><i class="fa-solid fa-check"></i> Hoàn thành Set (+40 XP)</button>
        </div>
        <div id="gymLogs"></div>
    </div>

    <div id="mind" class="section">
        <div class="card">
            <h3><i class="fa-solid fa-spa"></i> Nuôi dưỡng tâm hồn</h3>
            <select id="mindType">
                <option value="gratitude">🙏 Nhật ký biết ơn</option>
                <option value="meditation">🧘 Thiền định</option>
                <option value="journal">📓 Nhật ký suy ngẫm</option>
            </select>
            <textarea id="mindContent" rows="4" placeholder="Viết những điều bạn đang nghĩ..."></textarea>
            <button class="action-btn" onclick="addLog('mind')"><i class="fa-solid fa-feather"></i> Lưu dòng suy nghĩ (+30 XP)</button>
        </div>
        <div id="mindLogs"></div>
    </div>

    <div id="stats" class="section">
        <div class="card">
            <h3><i class="fa-solid fa-chart-pie"></i> Thống Kê</h3>
            <div class="stat-card">
                <h4>📚 Tổng số phiên học</h4>
                <div class="stat-value" id="statLearning">0</div>
            </div>
            <div class="stat-card">
                <h4>💪 Tổng số set gym</h4>
                <div class="stat-value" id="statGym">0</div>
            </div>
            <div class="stat-card">
                <h4>🧘 Tổng số bài nhật ký</h4>
                <div class="stat-value" id="statMind">0</div>
            </div>
        </div>
        <div class="card">
            <h3><i class="fa-solid fa-database"></i> Quản lý dữ liệu</h3>
            <p style="color: var(--text-muted); font-size: 0.9em;">Dữ liệu đang được lưu an toàn trong trình duyệt.</p>
            <button class="action-btn" style="background: linear-gradient(135deg, #ef4444, #b91c1c);" onclick="clearAllData()"><i class="fa-solid fa-trash"></i> Reset toàn bộ hành trình</button>
        </div>
    </div>

    <script>
        let userData = {
            level: 1,
            xp: 0,
            learningLogs: [],
            gymLogs: [],
            mindLogs: []
        };

        function loadData() {
            const saved = localStorage.getItem('lifeOSData');
            if (saved) {
                userData = JSON.parse(saved);
            }
            updateUI();
            renderAllLogs();
        }

        function saveData() {
            localStorage.setItem('lifeOSData', JSON.stringify(userData));
        }

        function updateUI() {
            const xpForNextLevel = userData.level * 1000;
            const xpProgress = (userData.xp / xpForNextLevel) * 100;
            
            document.getElementById('userLevel').textContent = `LVL ${userData.level}`;
            document.getElementById('currentXP').textContent = userData.xp;
            document.getElementById('nextLevelXP').textContent = xpForNextLevel;
            document.getElementById('xpBar').style.width = xpProgress + '%';

            document.getElementById('statLearning').textContent = userData.learningLogs.length;
            document.getElementById('statGym').textContent = userData.gymLogs.length;
            document.getElementById('statMind').textContent = userData.mindLogs.length;
        }

        function addXP(amount) {
            userData.xp += amount;
            const xpForNextLevel = userData.level * 1000;
            
            if (userData.xp >= xpForNextLevel) {
                userData.level++;
                userData.xp = userData.xp - xpForNextLevel;
                showNotification(`🎉 LEVEL UP! Bạn đã đạt level ${userData.level}!`);
            } else {
                showNotification(`+${amount} XP 🌟`);
            }
            
            updateUI();
            saveData();
        }

        function showNotification(text) {
            const notif = document.createElement('div');
            notif.className = 'xp-notification';
            notif.textContent = text;
            document.body.appendChild(notif);
            
            setTimeout(() => {
                notif.style.animation = 'popIn 0.3s ease-out reverse';
                setTimeout(() => notif.remove(), 300);
            }, 2000);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function addLog(type) {
            const timestamp = new Date().toLocaleString('vi-VN');
            
            if (type === 'learning') {
                const subject = document.getElementById('learnSubject').value;
                const duration = document.getElementById('learnDuration').value;
                const rating = document.getElementById('learnRating').value;
                const takeaway = document.getElementById('learnTakeaway').value;
                
                if (!subject || !duration) {
                    alert('Vui lòng điền đầy đủ thông tin!');
                    return;
                }
                
                userData.learningLogs.unshift({
                    timestamp,
                    subject,
                    duration,
                    rating,
                    takeaway
                });
                
                document.getElementById('learnSubject').value = '';
                document.getElementById('learnDuration').value = '';
                document.getElementById('learnTakeaway').value = '';
                
                addXP(50);
                renderLogs('learning');
                
            } else if (type === 'gym') {
                const exercise = document.getElementById('gymExercise').value;
                const kg = document.getElementById('gymKg').value;
                const reps = document.getElementById('gymReps').value;
                
                if (!exercise || !kg || !reps) {
                    alert('Vui lòng điền đầy đủ thông tin!');
                    return;
                }
                
                userData.gymLogs.unshift({
                    timestamp,
                    exercise,
                    kg,
                    reps
                });
                
                document.getElementById('gymExercise').value = '';
                document.getElementById('gymKg').value = '';
                document.getElementById('gymReps').value = '';
                
                addXP(40);
                renderLogs('gym');
                
            } else if (type === 'mind') {
                const mindType = document.getElementById('mindType').options[document.getElementById('mindType').selectedIndex].text;
                const content = document.getElementById('mindContent').value;
                
                if (!content) {
                    alert('Vui lòng viết gì đó!');
                    return;
                }
                
                userData.mindLogs.unshift({
                    timestamp,
                    type: mindType,
                    content
                });
                
                document.getElementById('mindContent').value = '';
                
                addXP(30);
                renderLogs('mind');
            }
            
            saveData();
        }

        function renderLogs(type) {
            let container, logs, html = '';
            
            if (type === 'learning') {
                container = document.getElementById('learningLogs');
                logs = userData.learningLogs;
                
                logs.forEach(log => {
                    html += `
                        <div class="log-item">
                            <div class="log-date">${log.timestamp}</div>
                            <strong>📚 ${log.subject}</strong>
                            <div style="margin-top: 8px; color: var(--text-muted);">
                                ⏱️ ${log.duration} phút • Đánh giá: ${log.rating}/5
                            </div>
                            ${log.takeaway ? `<div style="margin-top: 8px; font-style: italic;">"${log.takeaway}"</div>` : ''}
                        </div>
                    `;
                });
                
            } else if (type === 'gym') {
                container = document.getElementById('gymLogs');
                logs = userData.gymLogs;
                
                logs.forEach(log => {
                    html += `
                        <div class="log-item">
                            <div class="log-date">${log.timestamp}</div>
                            <strong>💪 ${log.exercise}</strong>
                            <div style="margin-top: 8px; color: var(--text-muted);">
                                ${log.kg} kg × ${log.reps} reps
                            </div>
                        </div>
                    `;
                });
                
            } else if (type === 'mind') {
                container = document.getElementById('mindLogs');
                logs = userData.mindLogs;
                
                logs.forEach(log => {
                    html += `
                        <div class="log-item">
                            <div class="log-date">${log.timestamp}</div>
                            <strong>${log.type}</strong>
                            <div style="margin-top: 8px; line-height: 1.6;">${log.content}</div>
                        </div>
                    `;
                });
            }
            
            container.innerHTML = html;
        }

        function renderAllLogs() {
            renderLogs('learning');
            renderLogs('gym');
            renderLogs('mind');
        }

        function clearAllData() {
            if (confirm('⚠️ Bạn có chắc muốn reset toàn bộ dữ liệu? Hành động này không thể hoàn tác!')) {
                localStorage.removeItem('lifeOSData');
                userData = {
                    level: 1,
                    xp: 0,
                    learningLogs: [],
                    gymLogs: [],
                    mindLogs: []
                };
                updateUI();
                renderAllLogs();
                showNotification('🔄 Đã reset toàn bộ dữ liệu!');
            }
        }

        loadData();
    </script>
</body>
</html>
