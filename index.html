<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Life OS | Self-Mastery</title>
    <style>
        /* --- CSS: Giao diện Cyberpunk/Minimalist --- */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --accent: #00ff88; /* Màu xanh neon */
            --danger: #ff5555;
            --secondary: #bb86fc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2, h3 { margin-top: 0; }

        /* Dashboard Header */
        .header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border-bottom: 2px solid var(--accent);
        }

        .level-badge {
            background: var(--accent);
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid #333;
            color: var(--text-main);
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }

        .tab-btn:hover, .tab-btn.active {
            background: var(--secondary);
            color: white;
            border-color: var(--secondary);
        }

        /* Main Content Sections */
        .section {
            display: none; /* Ẩn hết, chỉ hiện cái đang chọn */
            width: 100%;
            max-width: 800px;
            animation: fadeIn 0.5s;
        }

        .section.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Input Card Styles */
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #2c2c2c;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button.action-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        button.action-btn:hover { opacity: 0.9; }

        /* List Logs */
        .log-item {
            background: #252525;
            padding: 10px;
            margin-top: 5px;
            border-left: 3px solid var(--secondary);
            border-radius: 4px;
            font-size: 0.9em;
        }

        /* XP Progress Bar */
        .xp-container {
            width: 100%;
            background: #333;
            height: 10px;
            border-radius: 5px;
            margin-top: 5px;
            overflow: hidden;
        }
        .xp-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--secondary));
            width: 0%;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>🚀 Dashboard</h2>
            <div style="font-size: 0.9em; color: #aaa;">"Hôm nay bạn tốt hơn hôm qua 1%"</div>
        </div>
        <div style="text-align: right;">
            <div class="level-badge" id="userLevel">LVL 1</div>
            <div style="margin-top:5px; font-size: 0.8em;">XP: <span id="currentXP">0</span> / <span id="nextLevelXP">1000</span></div>
            <div class="xp-container">
                <div class="xp-bar" id="xpBar"></div>
            </div>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('learning')">📚 Học Tập</button>
        <button class="tab-btn" onclick="switchTab('gym')">💪 Gym & Sức Khỏe</button>
        <button class="tab-btn" onclick="switchTab('mind')">🧘 Tâm Trí & Nhật Ký</button>
        <button class="tab-btn" onclick="switchTab('stats')">📊 Thống Kê</button>
    </div>

    <div id="learning" class="section active">
        <div class="card">
            <h3>📝 Ghi nhận buổi học</h3>
            <input type="text" id="learnSubject" placeholder="Môn học (VD: C++, Tiếng Nhật)">
            <input type="number" id="learnDuration" placeholder="Thời gian (phút)">
            <input type="text" id="learnTakeaway" placeholder="Bài học rút ra (ngắn gọn)">
            
            <label>Mức độ hiệu quả (1-5):</label>
            <select id="learnRating">
                <option value="5">🔥🔥🔥🔥🔥 Tuyệt vời</option>
                <option value="4">🔥🔥🔥🔥 Tốt</option>
                <option value="3">🔥🔥 Bình thường</option>
                <option value="2">🔥 Hơi mất tập trung</option>
                <option value="1">💤 Không hiệu quả</option>
            </select>
            
            <button class="action-btn" onclick="addLog('learning')">Lưu & Nhận +50 XP</button>
        </div>
        <div id="learningLogs"></div>
    </div>

    <div id="gym" class="section">
        <div class="card">
            <h3>🏋️ Ghi nhận Gym</h3>
            <input type="text" id="gymExercise" placeholder="Bài tập (VD: Bench Press)">
            <div style="display: flex; gap: 10px;">
                <input type="number" id="gymKg" placeholder="Kg">
                <input type="number" id="gymReps" placeholder="Reps">
            </div>
            <button class="action-btn" onclick="addLog('gym')">Lưu & Nhận +40 XP</button>
        </div>
        <div id="gymLogs"></div>
    </div>

    <div id="mind" class="section">
        <div class="card">
            <h3>🧘 Thiền & Biết ơn</h3>
            <select id="mindType">
                <option value="meditation">Thiền định</option>
                <option value="gratitude">Nhật ký biết ơn</option>
                <option value="detox">Digital Detox (Cai điện thoại)</option>
            </select>
            <textarea id="mindContent" rows="3" placeholder="Ghi chú chi tiết (VD: 5 điều biết ơn hôm nay...)"></textarea>
            <button class="action-btn" onclick="addLog('mind')">Lưu & Nhận +30 XP</button>
        </div>
        <div id="mindLogs"></div>
    </div>

    <div id="stats" class="section">
        <div class="card">
            <h3>📅 Lịch sử hoạt động</h3>
            <p>Dữ liệu đang được lưu trong LocalStorage của trình duyệt này.</p>
            <button class="action-btn" style="background: var(--danger); color: white;" onclick="clearAllData()">🗑️ Xóa toàn bộ dữ liệu</button>
        </div>
    </div>

    <script>
        // --- JAVASCRIPT LOGIC ---

        // 1. Khởi tạo dữ liệu (State Management)
        let appData = {
            xp: 0,
            level: 1,
            logs: []
        };

        // 2. Hàm Load dữ liệu từ LocalStorage khi mở web
        function loadData() {
            const savedData = localStorage.getItem('myLifeOS_Data');
            if (savedData) {
                appData = JSON.parse(savedData);
                updateUI();
                renderLogs();
            }
        }

        // 3. Hàm Lưu dữ liệu xuống LocalStorage
        function saveData() {
            localStorage.setItem('myLifeOS_Data', JSON.stringify(appData));
            updateUI();
        }

        // 4. Xử lý Logic Thêm Log (Học, Gym, Mind)
        function addLog(type) {
            let logEntry = {
                id: Date.now(),
                date: new Date().toLocaleDateString('vi-VN') + ' ' + new Date().toLocaleTimeString('vi-VN'),
                type: type,
                content: ''
            };
            let xpGained = 0;

            if (type === 'learning') {
                const subject = document.getElementById('learnSubject').value;
                const time = document.getElementById('learnDuration').value;
                const note = document.getElementById('learnTakeaway').value;
                if(!subject) return alert("Chưa nhập môn học!");
                
                logEntry.content = `[Học] ${subject} - ${time}p: ${note}`;
                xpGained = 50;
                // Clear input
                document.getElementById('learnSubject').value = '';
                document.getElementById('learnTakeaway').value = '';
            } 
            else if (type === 'gym') {
                const ex = document.getElementById('gymExercise').value;
                const kg = document.getElementById('gymKg').value;
                const reps = document.getElementById('gymReps').value;
                if(!ex) return alert("Chưa nhập bài tập!");

                logEntry.content = `[Gym] ${ex}: ${kg}kg x ${reps} reps`;
                xpGained = 40;
                document.getElementById('gymExercise').value = '';
            }
            else if (type === 'mind') {
                const mode = document.getElementById('mindType').value;
                const text = document.getElementById('mindContent').value;
                if(!text) return alert("Chưa viết gì cả!");

                logEntry.content = `[Tâm trí - ${mode}] ${text}`;
                xpGained = 30;
                document.getElementById('mindContent').value = '';
            }

            // Cập nhật Data
            appData.logs.unshift(logEntry); // Thêm vào đầu mảng
            appData.xp += xpGained;
            checkLevelUp();
            saveData();
            renderLogs();
            alert(`Đã lưu! Bạn nhận được +${xpGained} XP 🚀`);
        }

        // 5. Hệ thống Level
        function checkLevelUp() {
            const requiredXP = appData.level * 1000;
            if (appData.xp >= requiredXP) {
                appData.level++;
                alert("🎉 CHÚC MỪNG! BẠN ĐÃ LÊN LEVEL " + appData.level);
            }
        }

        // 6. Cập nhật giao diện XP
        function updateUI() {
            document.getElementById('userLevel').innerText = "LVL " + appData.level;
            document.getElementById('currentXP').innerText = appData.xp;
            const nextXP = appData.level * 1000;
            document.getElementById('nextLevelXP').innerText = nextXP;
            
            const percentage = (appData.xp / nextXP) * 100;
            document.getElementById('xpBar').style.width = percentage + "%";
        }

        // 7. Hiển thị danh sách Log ra màn hình
        function renderLogs() {
            // Lọc và hiển thị log cho từng tab (ở đây làm đơn giản hiển thị theo type)
            const types = ['learning', 'gym', 'mind'];
            
            types.forEach(type => {
                const container = document.getElementById(type + 'Logs');
                if(!container) return;
                
                // Lọc log thuộc loại này
                const filteredLogs = appData.logs.filter(log => log.type === type);
                
                let html = '';
                filteredLogs.forEach(log => {
                    html += `<div class="log-item">
                                <small style="color:#888">${log.date}</small><br>
                                ${log.content}
                             </div>`;
                });
                container.innerHTML = html;
            });
        }

        // 8. Chuyển Tab
        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // 9. Xóa data (Reset)
        function clearAllData() {
            if(confirm("Bạn có chắc muốn xóa toàn bộ quá trình không?")) {
                localStorage.removeItem('myLifeOS_Data');
                appData = { xp: 0, level: 1, logs: [] };
                location.reload();
            }
        }

        // Chạy khi web load
        loadData();

    </script>
</body>
</html>
