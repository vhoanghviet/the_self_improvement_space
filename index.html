<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Life OS | Self-Mastery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f172a; /* Xanh đen thẳm */
            --glass-bg: rgba(30, 41, 59, 0.7); /* Kính mờ */
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #22d3ee; /* Cyan Neon */
            --secondary: #a855f7; /* Purple Neon */
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --success: #34d399;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 10% 20%, rgba(34, 211, 238, 0.1) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Header Card --- */
        .header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h2 { margin: 0; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(to right, var(--accent), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* --- Level Badge & XP --- */
        .level-info { text-align: right; }
        .level-badge {
            background: linear-gradient(135deg, var(--accent), var(--secondary));
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 800;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.5);
        }

        .xp-container {
            width: 120px;
            background: rgba(255,255,255,0.1);
            height: 8px;
            border-radius: 10px;
            margin-top: 8px;
            overflow: hidden;
        }
        .xp-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--secondary));
            width: 0%;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 8px var(--accent);
        }

        /* --- Navigation Tabs --- */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.9em;
        }

        .tab-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
        .tab-btn.active {
            background: var(--text-main);
            color: var(--bg-dark);
            border-color: var(--text-main);
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        /* --- Input Cards --- */
        .section { display: none; width: 100%; max-width: 600px; animation: slideUp 0.4s ease-out; }
        .section.active { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--glass-bg);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            margin-bottom: 20px;
        }

        .card h3 { margin-top: 0; font-size: 1.2em; display: flex; align-items: center; gap: 10px; }
        .card h3 i { color: var(--accent); }

        /* Inputs Styling */
        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0 15px 0;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-radius: 10px;
            box-sizing: border-box;
            font-family: inherit;
            transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.2);
        }

        /* Buttons */
        button.action-btn {
            background: linear-gradient(135deg, var(--accent), #3b82f6);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        button.action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(34, 211, 238, 0.4);
        }
        button.action-btn:active { transform: translateY(0); }

        /* --- Log Items --- */
        .log-item {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            margin-top: 10px;
            border-left: 4px solid var(--secondary);
            border-radius: 8px;
            font-size: 0.95em;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
        }
        .log-date { font-size: 0.75em; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2><i class="fa-solid fa-layer-group"></i> Life OS</h2>
            <div style="font-size: 0.85em; color: var(--text-muted); margin-top: 5px;">Build your dream life, one day at a time.</div>
        </div>
        <div class="level-info">
            <span class="level-badge" id="userLevel">LVL 1</span>
            <div style="margin-top:8px; font-size: 0.75em; color: var(--text-muted);">XP: <span id="currentXP">0</span> / <span id="nextLevelXP">1000</span></div>
            <div class="xp-container">
                <div class="xp-bar" id="xpBar"></div>
            </div>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('learning')"><i class="fa-solid fa-code"></i> Học Tập</button>
        <button class="tab-btn" onclick="switchTab('gym')"><i class="fa-solid fa-dumbbell"></i> Gym</button>
        <button class="tab-btn" onclick="switchTab('mind')"><i class="fa-solid fa-brain"></i> Tâm Trí</button>
        <button class="tab-btn" onclick="switchTab('stats')"><i class="fa-solid fa-chart-pie"></i> Thống Kê</button>
    </div>

    <div id="learning" class="section active">
        <div class="card">
            <h3><i class="fa-solid fa-graduation-cap"></i> Nhật ký học tập</h3>
            <input type="text" id="learnSubject" placeholder="Hôm nay học gì? (VD: C++ Pointer)">
            
            <div style="display: flex; gap: 10px;">
                <input type="number" id="learnDuration" placeholder="Phút" style="flex:1">
                <select id="learnRating" style="flex:1">
                    <option value="5">🔥 Siêu tập trung</option>
                    <option value="4">✨ Tốt</option>
                    <option value="3">😐 Bình thường</option>
                    <option value="2">🥱 Hơi lười</option>
                </select>
            </div>

            <textarea id="learnTakeaway" rows="2" placeholder="Bài học rút ra là..."></textarea>
            
            <button class="action-btn" onclick="addLog('learning')"><i class="fa-solid fa-plus"></i> Lưu & Nhận +50 XP</button>
        </div>
        <div id="learningLogs"></div>
    </div>

    <div id="gym" class="section">
        <div class="card">
            <h3><i class="fa-solid fa-heart-pulse"></i> Gym & Sức khỏe</h3>
            <input type="text" id="gymExercise" placeholder="Bài tập (VD: Squat)">
            <div style="display: flex; gap: 10px;">
                <input type="number" id="gymKg" placeholder="Kg">
                <input type="number" id="gymReps" placeholder="Reps">
            </div>
            <button class="action-btn" onclick="addLog('gym')"><i class="fa-solid fa-check"></i> Hoàn thành Set (+40 XP)</button>
        </div>
        <div id="gymLogs"></div>
    </div>

    <div id="mind" class="section">
        <div class="card">
            <h3><i class="fa-solid fa-spa"></i> Nuôi dưỡng tâm hồn</h3>
            <select id="mindType">
                <option value="gratitude">🙏 Nhật ký biết ơn</option>
                <option value="meditation">🧘 Thiền định</option>
                <option value="journal">📓 Nhật ký suy ngẫm</option>
            </select>
            <textarea id="mindContent" rows="4" placeholder="Viết những điều bạn đang nghĩ..."></textarea>
            <button class="action-btn" onclick="addLog('mind')"><i class="fa-solid fa-feather"></i> Lưu dòng suy nghĩ (+30 XP)</button>
        </div>
        <div id="mindLogs"></div>
    </div>

    <div id="stats" class="section">
        <div class="card">
            <h3><i class="fa-solid fa-database"></i> Dữ liệu của bạn</h3>
            <p style="color: var(--text-muted); font-size: 0.9em;">Dữ liệu đang được lưu an toàn trong trình duyệt.</p>
            <button class="action-btn" style="background: linear-gradient(135deg, #ef4444, #b91c1c);" onclick="clearAllData()"><i class="fa-solid fa-trash"></i> Reset toàn bộ hành trình</button>
        </div>
    </div>

    </body>
</html>
